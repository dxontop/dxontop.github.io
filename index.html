<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Exalted Ones</title>

    <link rel="icon" type="image/png" href="https://file.garden/amQoMeBMSROPxoxS/icon1.jpg">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ascendd.xyz/">
    <meta property="og:title" content="The Exalted Ones">
    <meta property="og:description" content="We run everything silently.">

    <meta name="twitter:card" content="summary_small_image">
    <meta name="twitter:title" content="The Exalted Ones">
    <meta name="twitter:description" content="We run everything silently.">

    <meta name="theme-color" content="#080808">
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Poppins:wght@300;400;600;700&family=Cinzel:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@300;400;500;600&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080808;
            --surface: rgba(255,255,255,0.03);
            --border: rgba(255,255,255,0.07);
            --text: #e8e8e8;
            --muted: #555;
            --dim: #333;
            --accent: #ffffff;
            --red: #c0392b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .reveal {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        #main-bg {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image: url('/assets/img/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.22;
            pointer-events: none;
        }

        #main-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(8,8,8,0.5), rgba(8,8,8,0.94) 78%);
        }

        #bg-flicker {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: rgba(255,255,255,0.35);
            opacity: 0;
            pointer-events: none;
            animation: bg-flicker 7s infinite;
        }

        @keyframes bg-flicker {
            0%, 90%, 100% { opacity: 0; }
            91% { opacity: 0.75; }
            92% { opacity: 0.1; }
            93% { opacity: 0.9; }
            94% { opacity: 0; }
            95% { opacity: 0.55; }
            96% { opacity: 0; }
        }

        #intro {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: opacity 0.9s ease, visibility 0.9s ease;
            cursor: pointer;
            opacity: 1;
            visibility: visible;
        }

        #intro.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #intro .brand {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: clamp(0.9rem, 2.6vw, 1.2rem);
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #cfcfcf 55%, #888888 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 22px rgba(255,255,255,0.18);
        }

        #intro h2 {
            font-family: 'Space Mono', monospace;
            font-size: clamp(0.75rem, 2.5vw, 1rem);
            letter-spacing: 8px;
            text-transform: lowercase;
            color: #fff;
            animation: pulse 2.5s infinite;
        }

        #main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            min-height: 100vh;
            padding: 60px 20px 80px;
            position: relative;
            z-index: 10;
            animation: fadeIn 0.8s ease;
        }

        #main-content.visible {
            display: flex;
        }

        .site-title {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: clamp(0.95rem, 2.8vw, 1.4rem);
            letter-spacing: 5px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #d4d4d4 50%, #8f8f8f 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 24px rgba(255,255,255,0.15);
            margin-bottom: 50px;
        }

        .founders-wrapper {
            width: 100%;
            max-width: 700px;
            margin-bottom: 60px;
        }

        .founders-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            cursor: pointer;
        }

        .founders-header::before,
        .founders-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .founders-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 6px;
            color: var(--muted);
            text-transform: uppercase;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.35s ease, letter-spacing 0.35s ease;
        }

        .founders-header:hover .founders-label,
        .founders-header:focus .founders-label {
            color: var(--text);
            letter-spacing: 7px;
        }

        #founders-grid {
            display: flex;
            justify-content: center;
            gap: 40px;
            overflow: hidden;
            max-height: 300px;
            transition: max-height 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
            opacity: 1;
        }

        #founders-grid.collapsed {
            max-height: 0;
            opacity: 0;
        }

        .founder-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
            position: relative;
        }

        .founder-card:hover,
        .founder-card:focus {
            transform: scale(1.05);
        }

        .founder-card:hover .founder-links,
        .founder-card:focus-within .founder-links,
        .founder-card.spread .founder-links {
            max-height: 48px;
            opacity: 1;
            margin-top: 8px;
        }

        .founder-card:hover .founder-link,
        .founder-card:focus-within .founder-link,
        .founder-card.spread .founder-link {
            opacity: 1;
            transform: scale(1);
            pointer-events: all;
        }

        .founder-card:focus .founder-avatar {
            box-shadow: 0 4px 30px rgba(0,0,0,0.8), 0 0 0 2px rgba(255,255,255,0.3);
        }

        .founder-avatar-wrap {
            position: relative;
            width: 90px;
            height: 90px;
        }

        .founder-avatar {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.12);
            box-shadow: 0 4px 30px rgba(0,0,0,0.8);
            background: #111;
            z-index: 2;
        }

        .founder-decoration {
            position: absolute;
            width: 100px;
            height: 100px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 4;
            object-fit: contain;
        }

        .founder-status-dot {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #747f8d;
            border: 2px solid var(--bg);
            z-index: 3;
            transition: background 0.3s ease;
        }

        .founder-name {
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 3px;
            color: var(--muted);
            text-transform: lowercase;
            text-align: center;
        }

        .founder-tag {
            font-size: 0.55rem;
            color: var(--dim);
            font-family: 'Space Mono', monospace;
            letter-spacing: 1px;
        }

        /* ── founder social links: hidden, "spread" open on hover/focus/tap ── */
        .founder-links {
            display: flex;
            flex-direction: row;
            gap: 10px;
            max-height: 0;
            margin-top: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, opacity 0.3s ease, margin-top 0.35s ease;
            align-items: center;
            justify-content: center;
        }

        .founder-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 0;
            border: none;
            background: transparent;
            color: var(--muted);
            font-family: 'Space Mono', monospace;
            font-size: 0.4rem;
            letter-spacing: 0.5px;
            text-align: center;
            line-height: 1;
            text-decoration: none;
            opacity: 0;
            transform: scale(0.7);
            transition: opacity 0.3s ease, transform 0.3s ease, color 0.2s ease;
            pointer-events: none;
        }

        .founder-link:nth-child(1) { transition-delay: 0s; }
        .founder-link:nth-child(2) { transition-delay: 0.06s; }
        .founder-link:nth-child(3) { transition-delay: 0.12s; }

        .founder-link:hover,
        .founder-link:focus {
            color: #fff;
            transform: scale(1.15);
        }

        .founder-link img {
            width: 18px;
            height: 18px;
            display: block;
            object-fit: contain;
            mix-blend-mode: multiply;
            filter: contrast(1.05);
        }

        .servers-wrapper {
            width: 100%;
            max-width: 900px;
            margin-bottom: 60px;
        }

        .servers-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .servers-header::before,
        .servers-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .servers-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 6px;
            color: var(--muted);
            text-transform: uppercase;
            white-space: nowrap;
        }

        .carousel {
            position: relative;
            width: 100%;
            overflow: hidden;
            -webkit-mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent);
            mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent);
        }

        .carousel-track {
            display: flex;
            width: max-content;
            gap: 20px;
            animation: carousel-scroll 20s linear infinite;
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        body.red-mode .carousel-track {
            animation-duration: 5s;
        }

        .carousel:hover .carousel-track {
            animation-play-state: paused;
        }

        @keyframes carousel-scroll {
            from { transform: translate3d(0, 0, 0); }
            to   { transform: translate3d(-50%, 0, 0); }
        }

        .server-card {
            flex: 0 0 auto;
            display: block;
            width: 340px;
            height: 178px;
            border-radius: 0;
            overflow: visible;
            border: none;
            background: transparent;
            text-decoration: none;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s ease;
        }

        .server-card:hover {
            transform: translateY(-6px) scale(1.03);
            filter: drop-shadow(0 12px 24px rgba(0,0,0,0.45));
        }

        /* transparent by default — only the banner image itself will be visible */
        .server-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .server-icon img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        @media (max-width: 900px) {
            .server-card {
                width: 270px;
                height: 141px;
            }
        }

        @media (max-width: 480px) {
            .server-card {
                width: 200px;
                height: 104px;
            }
            .carousel-track { gap: 14px; }
        }

        .about-wrapper {
            width: 100%;
            max-width: 700px;
            margin-bottom: 60px;
        }

        .about-card {
            position: relative;
            width: 100%;
            padding: 60px 44px;
            border-radius: 28px;
            background:
                radial-gradient(ellipse at top, rgba(255,255,255,0.05), transparent 60%),
                rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            text-align: center;
            overflow: hidden;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.6s ease,
                        box-shadow 0.6s ease;
        }

        .about-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255,255,255,0.14);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .about-title {
            font-family: 'Playfair Display', serif;
            font-style: normal;
            font-weight: 800;
            font-size: clamp(2.1rem, 5.6vw, 3rem);
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 0%, #d4d4d4 50%, #8f8f8f 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 24px rgba(255,255,255,0.15);
            margin-bottom: 22px;
            opacity: 0;
            transform: translateY(14px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s,
                        transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
        }

        .about-divider {
            width: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
            margin: 0 auto 30px;
            transition: width 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.35s;
        }

        .about-description {
            font-family: 'Manrope', sans-serif;
            font-style: normal;
            font-weight: 400;
            font-size: clamp(0.92rem, 2.1vw, 1.05rem);
            letter-spacing: 0.2px;
            line-height: 1.9;
            color: var(--text);
            opacity: 0.8;
            max-width: 560px;
            margin: 0 auto;
        }

        .about-card.revealed .about-title {
            opacity: 1;
            transform: translateY(0);
        }

        .about-card.revealed .about-divider {
            width: 60px;
        }

        .typing-cursor {
            font-family: 'Manrope', sans-serif;
            font-weight: 300;
            color: var(--text);
            margin-left: 2px;
            animation: cursor-blink 0.9s steps(1) infinite;
        }

        @keyframes cursor-blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        @media (max-width: 600px) {
            .about-card { padding: 44px 26px; border-radius: 20px; }
        }

        .section-wrapper {
            width: 100%;
            max-width: 700px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .section-header::before,
        .section-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .section-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 6px;
            color: var(--muted);
            text-transform: uppercase;
            white-space: nowrap;
        }

        .members-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px 20px;
            justify-items: center;
        }

        .member-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
        }

        .member-card:hover,
        .member-card:focus {
            transform: scale(1.05);
        }

        .member-card:focus .member-avatar {
            box-shadow: 0 4px 24px rgba(0,0,0,0.7), 0 0 0 2px rgba(255,255,255,0.25);
        }

        .member-avatar-wrap {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .member-avatar {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 24px rgba(0,0,0,0.7);
            background: #111;
            z-index: 2;
        }

        .member-decoration {
            position: absolute;
            width: 100px;
            height: 100px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 4;
            object-fit: contain;
        }

        .member-status-dot {
            position: absolute;
            bottom: 3px;
            right: 3px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #747f8d;
            border: 2px solid var(--bg);
            z-index: 3;
            transition: background 0.3s ease;
        }

        .member-name {
            font-family: 'Space Mono', monospace;
            font-size: 0.55rem;
            letter-spacing: 2px;
            color: var(--muted);
            text-transform: lowercase;
            text-align: center;
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #audio-toggle {
            position: fixed;
            bottom: 22px;
            right: 22px;
            z-index: 50;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            color: var(--muted);
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: background 0.35s ease, color 0.35s ease, border-color 0.35s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
        }

        #audio-toggle:hover,
        #audio-toggle:focus {
            background: rgba(255,255,255,0.08);
            color: var(--text);
            border-color: rgba(255,255,255,0.18);
            transform: scale(1.06);
        }

        #audio-toggle .audio-icon {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 1px;
            line-height: 1;
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {
            #audio-toggle { width: 38px; height: 38px; bottom: 16px; right: 16px; }
        }

        /* ── red mode toggle ── */
        /* ── red mode toggle ── */
        #theme-toggle {
            position: fixed;
            top: 22px;
            right: 22px;
            z-index: 50;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: background 0.35s ease, border-color 0.35s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
        }

        #theme-toggle:hover,
        #theme-toggle:focus {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.18);
            transform: scale(1.08);
        }

        #theme-toggle .theme-icon {
            width: 20px;
            height: 20px;
            color: #cfcfcf;
            transition: color 0.35s ease, filter 0.35s ease;
            transform-origin: 50% 50%;
        }

        @keyframes icon-spin {
            0%   { transform: rotate(0deg) scale(1); }
            35%  { transform: rotate(200deg) scale(1.2); }
            65%  { transform: rotate(340deg) scale(0.9); }
            100% { transform: rotate(720deg) scale(1); }
        }

        #theme-toggle .theme-icon.spinning {
            animation: icon-spin 0.65s cubic-bezier(0.34, 1.56, 0.56, 1);
        }

        body.red-mode #theme-toggle .theme-icon {
            color: var(--red);
            filter: drop-shadow(0 0 6px rgba(224,60,50,0.85));
        }

        /* every piece of text on the page reads its color from these variables,
           so overriding them here turns all of it red at once */
        body.red-mode {
            --text: #ff5548;
            --muted: #c0392b;
            --dim: #7a1f16;
            --accent: #ff5548;
        }

        body.red-mode .site-title,
        body.red-mode .about-title,
        body.red-mode #intro .brand {
            background: linear-gradient(180deg, #ff8a7a 0%, #e0392c 55%, #7a1f16 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 24px rgba(224,60,50,0.35);
        }

        body.red-mode .founder-link:hover,
        body.red-mode .founder-link:focus,
        body.red-mode #audio-toggle:hover,
        body.red-mode #audio-toggle:focus {
            color: #ff8a7a;
        }

        /* ── aggressive strobing flicker while red mode is active ── */
        body.red-mode #bg-flicker {
            background: rgba(224,60,50,0.55);
            animation: bg-flicker-red 1.1s infinite;
        }

        @keyframes bg-flicker-red {
            0%, 38%, 100% { opacity: 0; }
            4%   { opacity: 0.95; }
            7%   { opacity: 0.1; }
            11%  { opacity: 1; }
            14%  { opacity: 0; }
            19%  { opacity: 0.7; }
            22%  { opacity: 0; }
            29%  { opacity: 0.85; }
            32%  { opacity: 0; }
        }

        /* ── aggressive glitching text while red mode is active ── */
        @keyframes text-glitch {
            0%, 100% {
                transform: translate(0, 0);
                text-shadow: none;
                clip-path: none;
                filter: none;
            }
            2% {
                transform: translate(-3px, 1px);
                text-shadow: 3px 0 rgba(224,60,50,0.9), -3px 0 rgba(0,225,255,0.7);

<script>
(function () {
    "use strict";

    const FOUNDERS = [
        { id: '1521890728094208122', tag: 'daz' },
        { id: '1512675755459612835', tag: 'dx' },
    ];

    const STATUS_COLORS = {
        online:  '#43b581',
        idle:    '#faa61a',
        dnd:     '#f04747',
        offline: '#747f8d',
    };

    const RETRY_DELAYS = [1000, 2000, 4000];

    const ABOUT_TEXT = "We’re just two idiots who decided to team up and chase something bigger than ourselves, quietly working to become one of the faces of this generation while staying humble every step of the way. Every move we make is calculated we run things silently, let our results speak louder than our names, and build a presence that commands respect without ever asking for it."
    let aboutTyped = false;
    function initAboutTyping() {
        if (aboutTyped) return;
        aboutTyped = true;

        const textEl = document.getElementById('about-description-text');
        const cursorEl = document.getElementById('about-cursor');
        if (!textEl) return;

        let i = 0;
        function type() {
            if (i <= ABOUT_TEXT.length) {
                textEl.textContent = ABOUT_TEXT.slice(0, i);
                i++;
                setTimeout(type, 28);
            } else if (cursorEl) {
                setTimeout(() => { cursorEl.style.display = 'none'; }, 1400);
            }
        }
        type();
    }

    function initScrollReveal() {
        const revealEls = document.querySelectorAll('.reveal');
        if (!revealEls.length) return;

        if (!('IntersectionObserver' in window)) {
            revealEls.forEach(el => el.classList.add('visible'));
            const card = document.querySelector('.about-card');
            if (card) card.classList.add('revealed');
            initAboutTyping();
            return;
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                entry.target.classList.add('visible');

                if (entry.target.classList.contains('about-wrapper')) {
                    const card = entry.target.querySelector('.about-card');
                    if (card) card.classList.add('revealed');
                    setTimeout(initAboutTyping, 550);
                }

                observer.unobserve(entry.target);
            });
        }, { threshold: 0.2, rootMargin: '0px 0px -60px 0px' });

        revealEls.forEach(el => observer.observe(el));
    }

    // Initialize splash screen
    function initIntro() {
        const intro = document.getElementById('intro');
        const mainContent = document.getElementById('main-content');
        if (!intro || !mainContent) return;

        function showMain() {
            intro.classList.add('hidden');
            mainContent.classList.add('visible');
            document.getElementById('audio-toggle').style.display = 'flex';
            var themeBtn = document.getElementById('theme-toggle');
            if (themeBtn) themeBtn.style.display = 'flex';
            playAudio();
        }

        intro.addEventListener('click', showMain);
        intro.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                showMain();
            }
        });
    }

    (function initStars() {
        const canvas = document.getElementById('stars');
        if (!canvas) return;
        const ctx    = canvas.getContext('2d');
        let stars    = [];
        let w, h;

        function resize() {
            w = canvas.width  = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        function genStars(n) {
            stars = [];
            for (let i = 0; i < n; i++) {
                stars.push({
                    x:  Math.random() * w,
                    y:  Math.random() * h,
                    r:  Math.random() * 1.1 + 0.2,
                    o:  Math.random() * 0.5 + 0.1,
                    s:  (Math.random() - 0.5) * 0.003,
                    vx: (Math.random() - 0.5) * 0.16,
                    vy: 0.1 + Math.random() * 0.16,
                    flicker: 0,
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, w, h);
            var isRed = document.body.classList.contains('red-mode');
            var rgb = isRed ? '224,60,50' : '255,255,255';
            stars.forEach(s => {
                s.o += s.s;
                if (s.o <= 0.05 || s.o >= 0.65) s.s *= -1;

                s.x += s.vx;
                s.y += s.vy;

                if (s.x < 0) s.x = w;
                if (s.x > w) s.x = 0;
                if (s.y < 0) s.y = h;
                if (s.y > h) s.y = 0;

                if (s.flicker > 0) s.flicker -= 0.045;

                var brightness = Math.min(1, s.o + s.flicker);

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${rgb},${brightness})`;
                ctx.fill();
            });
            requestAnimationFrame(draw);
        }

        function flickerBurst() {
            for (let i = 0; i < 20; i++) {
                var idx = Math.floor(Math.random() * stars.length);
                if (stars[idx]) stars[idx].flicker = 1;
            }
        }

        resize();
        genStars(180);
        draw();
        (function scheduleFlicker() {
            var isRed = document.body.classList.contains('red-mode');
            setTimeout(function() {
                flickerBurst();
                scheduleFlicker();
            }, isRed ? 600 : 7000);
        })();

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => { resize(); }, 150);
        });
    })();

    function avatarUrl(user, size) {
        size = size || 128;
        if (!user || !user.avatar) {
            return defaultAvatarUrl(user);
        }
        const ext = user.avatar.startsWith('a_') ? 'gif' : 'png';
        return 'https://cdn.discordapp.com/avatars/' + user.id + '/' + user.avatar + '.' + ext + '?size=' + size;
    }

    function defaultAvatarUrl(user) {
        if (!user) return 'https://cdn.discordapp.com/embed/avatars/0.png';
        if (!user.discriminator || user.discriminator === '0') {
            var idx = 0;
            try { idx = Number((BigInt(user.id) >> BigInt(22)) % BigInt(6)); } catch (e) { idx = 0; }
            return 'https://cdn.discordapp.com/embed/avatars/' + idx + '.png';
        }
        return 'https://cdn.discordapp.com/embed/avatars/' + (user.discriminator % 5) + '.png';
    }

    function setAvatarWithFallback(imgEl, user, size) {
        if (!imgEl || !user) return;
        size = size || 128;
        var isAnimated = !!(user.avatar && user.avatar.startsWith('a_'));
        var triedWebp = false;
        imgEl.src = avatarUrl(user, size);
        imgEl.onerror = function() {
            if (isAnimated && !triedWebp) {
                triedWebp = true;
                imgEl.src = 'https://cdn.discordapp.com/avatars/' + user.id + '/' + user.avatar + '.webp?size=' + size + '&animated=true';
                return;
            }
            imgEl.onerror = null;
            imgEl.src = defaultAvatarUrl(user);
        };
    }

    function applyStatus(dotEl, status) {
        if (!dotEl) return;
        dotEl.style.background = STATUS_COLORS[status] || STATUS_COLORS.offline;
        dotEl.setAttribute('data-status', status || 'offline');
    }

    async function fetchUser(id, attempt) {
        attempt = attempt || 0;
        try {
            var res  = await fetch('https://api.lanyard.rest/v1/users/' + id);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            var json = await res.json();
            if (!json.success) throw new Error('API error');
            return json.data;
        } catch (err) {
            if (attempt < RETRY_DELAYS.length) {
                await new Promise(function(r) { setTimeout(r, RETRY_DELAYS[attempt]); });
                return fetchUser(id, attempt + 1);
            }
            console.warn('Failed to fetch user ' + id + ':', err.message);
            return null;
        }
    }

    async function updateFounder(id) {
        var data = await fetchUser(id);
        var card = document.getElementById('founder-' + id);
        if (!card) return;

        var nameEl = card.querySelector('.founder-name');

        if (!data || !data.discord_user) {
            if (nameEl) nameEl.textContent = 'unavailable';
            return;
        }

        var discord_user = data.discord_user;
        var discord_status = data.discord_status;

        var founderAvatar = card.querySelector('.founder-avatar');
        setAvatarWithFallback(founderAvatar, discord_user, 128);

        if (nameEl) nameEl.textContent = discord_user.global_name || discord_user.username;
        applyStatus(card.querySelector('.founder-status-dot'), discord_status);

        var decEl = card.querySelector('.founder-decoration');
        if (decEl && discord_user.avatar_decoration_data && discord_user.avatar_decoration_data.asset) {
            decEl.src = 'https://cdn.discordapp.com/avatar-decoration-presets/' + discord_user.avatar_decoration_data.asset + '.png?size=128&passthrough=true';
            decEl.classList.remove('hidden');
            decEl.onerror = function() { decEl.classList.add('hidden'); };
        } else if (decEl) {
            decEl.classList.add('hidden');
        }
    }

    function initFounderToggle() {
        const toggle = document.getElementById('founders-toggle');
        const grid = document.getElementById('founders-grid');
        if (!toggle || !grid) return;

        toggle.addEventListener('click', function() {
            grid.classList.toggle('collapsed');
            const isExpanded = !grid.classList.contains('collapsed');
            toggle.setAttribute('aria-expanded', isExpanded);
        });

        toggle.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggle.click();
            }
        });
    }

    function initFounderSpread() {
        const cards = document.querySelectorAll('.founder-card');
        cards.forEach(card => {
            card.addEventListener('click', function(e) {
                if (e.target.closest('.founder-link')) return;
                card.classList.toggle('spread');
            });

            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    card.classList.toggle('spread');
                }
            });

            document.addEventListener('click', (e) => {
                if (!card.contains(e.target)) {
                    card.classList.remove('spread');
                }
            });
        });
    }

    function initAudio() {
        const audio = document.getElementById('bg-audio');
        const toggle = document.getElementById('audio-toggle');
        if (!audio || !toggle) return;

        toggle.addEventListener('click', function() {
            if (audio.paused) {
                audio.play();
                toggle.innerHTML = '<span class="audio-icon">❙❙</span>';
                toggle.setAttribute('aria-label', 'Pause background music');
            } else {
                audio.pause();
                toggle.innerHTML = '<span class="audio-icon">▶</span>';
                toggle.setAttribute('aria-label', 'Play background music');
            }
        });
    }

    function playAudio() {
        const audio = document.getElementById('bg-audio');
        if (!audio) return;
        var playPromise = audio.play();
        if (playPromise !== undefined) {
            playPromise.catch(function(error) {
                console.log('Audio autoplay prevented:', error);
            });
        }
    }

    function disableDevTools() {
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function(e) {
            var blocked =
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'i', 'j', 'c'].includes(e.key)) ||
                (e.ctrlKey && (e.key === 'U' || e.key === 'u'));

            if (blocked) {
                e.preventDefault();
            }
        });
    }

    // Song used normally vs. while red mode is active.
    // Replace RED_MODE_SONG with your own track's URL.
    const NORMAL_SONG   = 'https://file.garden/amQoMeBMSROPxoxS/sadbai';
    const RED_MODE_SONG = 'https://file.garden/amQoMeBMSROPxoxS/fuck%20you';

    // Icon markup swapped into the button's <svg class="theme-icon"> on toggle.
    const HEART_ICON_SVG = '<path d="M12 20.5C12 20.5 3.8 15.2 3.8 9.2 3.8 5.9 6.2 3.5 9.4 3.5c1.7 0 3.2.9 3.9 2.3.7-1.4 2.2-2.3 3.9-2.3 3.2 0 5.6 2.4 5.6 5.7 0 6-8.2 11.3-8.2 11.3z" fill="currentColor"/>';
    const SKULL_ICON_SVG = '<path d="M12 2C7.8 2 4.3 5.6 4.3 10c0 2.5 1.2 4.7 3.1 6.1h9.2c1.9-1.4 3.1-3.6 3.1-6.1C19.7 5.6 16.2 2 12 2z" fill="currentColor"/>' +
        '<rect x="7.4" y="15.6" width="9.2" height="1.3" fill="currentColor"/>' +
        '<path d="M7.4,16.9 L9.24,16.9 L8.32,19.9 Z M9.24,16.9 L11.08,16.9 L10.16,19.9 Z M11.08,16.9 L12.92,16.9 L12,19.9 Z M12.92,16.9 L14.76,16.9 L13.84,19.9 Z M14.76,16.9 L16.6,16.9 L15.68,19.9 Z" fill="currentColor"/>' +
        '<ellipse cx="8.7" cy="9.3" rx="2.05" ry="2.55" fill="var(--bg)"/>' +
        '<ellipse cx="15.3" cy="9.3" rx="2.05" ry="2.55" fill="var(--bg)"/>' +
        '<path d="M12 10.9l-1.35 2.5h2.7z" fill="var(--bg)"/>';

    function initThemeToggle() {
        const btn = document.getElementById('theme-toggle');
        const audio = document.getElementById('bg-audio');
        const icon = btn ? btn.querySelector('.theme-icon') : null;
        if (!btn) return;

        if (icon) {
            icon.addEventListener('animationend', function(e) {
                if (e.animationName === 'icon-spin') icon.classList.remove('spinning');
            });
        }

        btn.addEventListener('click', function() {
            var redMode = document.body.classList.toggle('red-mode');
            btn.setAttribute('aria-label', redMode ? 'Disable red mode' : 'Enable red mode');

            if (icon) {
                icon.classList.remove('spinning');
                void icon.offsetWidth; // restart the animation even on rapid clicks
                icon.innerHTML = redMode ? SKULL_ICON_SVG : HEART_ICON_SVG;
                icon.classList.add('spinning');
            }

            if (audio) {
                var wasPlaying = !audio.paused;
                var nextSrc = redMode ? RED_MODE_SONG : NORMAL_SONG;
                if (nextSrc && nextSrc !== 'YOUR_RED_MODE_SONG_URL_HERE') {
                    audio.src = nextSrc;
                    if (wasPlaying) audio.play().catch(function() {});
                }
            }
        });
    }

    FOUNDERS.forEach(founder => {
        updateFounder(founder.id);
    });

    initIntro();
    initScrollReveal();
    initFounderToggle();
    initFounderSpread();
    initAudio();
    disableDevTools();
    initThemeToggle();
})();
</script>
