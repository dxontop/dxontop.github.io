<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="splash-content">
            <img src="https://ui-avatars.com/api/?name=LOGO&background=0D8ABC&color=fff&size=128" alt="Logo" class="splash-logo" id="splash-logo">
            <h1 class="splash-title" id="splash-title">LOADING</h1>
        </div>
    </div>

    <!-- MAIN PROFILE CONTAINER -->
    <div class="container">
        <!-- PROFILE PICTURE -->
        <img src="" alt="Profile Picture" class="avatar" id="profile-avatar">

        <!-- USERNAME -->
        <h1 class="username" id="profile-username">@username</h1>
        
        <!-- SHORT BIO -->
        <p class="bio" id="profile-bio">Your bio here</p>

        <!-- LINKS SECTION -->
        <div class="links" id="links-container">
            <!-- Links will be added via JavaScript -->
        </div>

        <!-- FOOTER BRANDING -->
        <footer>
            MADE BY <span id="footer-name">USER</span>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
