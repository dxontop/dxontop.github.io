<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="The Exalted Ones">
    <meta name="theme-color" content="#080808">
    <link rel="icon" type="image/png" href="https://cdn.discordapp.com/attachments/1509164528460632085/1519045796044079134/T2S.jpg?ex=6a3c2124&is=6a3acfa4&hm=44ad3fa4b258da8b62caf53fc8c9fe6457c3182">
    <title>The Exalted Ones</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Poppins:wght@300;400;600;700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080808;
            --surface: rgba(255,255,255,0.03);
            --border: rgba(255,255,255,0.07);
            --text: #e8e8e8;
            --muted: #555;
            --dim: #333;
            --accent: #ffffff;
            --red: #c0392b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        #main-bg {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image: url('/assets/img/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.22;
            pointer-events: none;
        }

        #main-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(8,8,8,0.5), rgba(8,8,8,0.94) 78%);
        }

        #intro {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: opacity 0.9s ease, visibility 0.9s ease;
            cursor: pointer;
            opacity: 1;
            visibility: visible;
        }

        #intro.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #intro .brand {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: clamp(0.9rem, 2.6vw, 1.2rem);
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #cfcfcf 55%, #888888 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 22px rgba(255,255,255,0.18);
        }

        #intro h2 {
            font-family: 'Space Mono', monospace;
            font-size: clamp(0.75rem, 2.5vw, 1rem);
            letter-spacing: 8px;
            text-transform: lowercase;
            color: #fff;
            animation: pulse 2.5s infinite;
        }

        #main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            min-height: 100vh;
            padding: 60px 20px 80px;
            position: relative;
            z-index: 10;
            animation: fadeIn 0.8s ease;
        }

        #main-content.visible {
            display: flex;
        }

        .site-title {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: clamp(0.95rem, 2.8vw, 1.4rem);
            letter-spacing: 5px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #d4d4d4 50%, #8f8f8f 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 24px rgba(255,255,255,0.15);
            margin-bottom: 50px;
        }

        .founders-wrapper {
            width: 100%;
            max-width: 700px;
            margin-bottom: 60px;
        }

        .founders-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            cursor: pointer;
        }

        .founders-header::before,
        .founders-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .founders-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 6px;
            color: var(--muted);
            text-transform: uppercase;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toggle-arrow {
            display: inline-block;
            transition: transform 0.3s ease;
            color: var(--dim);
            font-size: 0.7rem;
        }

        .toggle-arrow.open {
            transform: rotate(180deg);
        }

        #founders-grid {
            display: flex;
            justify-content: center;
            gap: 40px;
            overflow: hidden;
            max-height: 300px;
            transition: max-height 0.5s ease, opacity 0.4s ease;
            opacity: 1;
        }

        #founders-grid.collapsed {
            max-height: 0;
            opacity: 0;
        }

        .founder-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s ease;
            outline: none;
            position: relative;
        }

        .founder-card:hover,
        .founder-card:focus {
            transform: scale(1.05);
        }

        .founder-card:hover .founder-links,
        .founder-card:focus-within .founder-links,
        .founder-card.spread .founder-links {
            max-height: 120px;
            opacity: 1;
            margin-top: 8px;
        }

        .founder-card:hover .founder-link,
        .founder-card:focus-within .founder-link,
        .founder-card.spread .founder-link {
            opacity: 1;
            transform: scale(1);
            pointer-events: all;
        }

        .founder-card:focus .founder-avatar {
            box-shadow: 0 4px 30px rgba(0,0,0,0.8), 0 0 0 2px rgba(255,255,255,0.3);
        }

        .founder-avatar-wrap {
            position: relative;
            width: 90px;
            height: 90px;
        }

        .founder-avatar {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.12);
            box-shadow: 0 4px 30px rgba(0,0,0,0.8);
            background: #111;
            z-index: 2;
        }

        .founder-decoration {
            position: absolute;
            width: 100px;
            height: 100px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 4;
            object-fit: contain;
        }

        .founder-status-dot {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #747f8d;
            border: 2px solid var(--bg);
            z-index: 3;
            transition: background 0.3s ease;
        }

        .founder-name {
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 3px;
            color: var(--muted);
            text-transform: lowercase;
            text-align: center;
        }

        .founder-tag {
            font-size: 0.55rem;
            color: var(--dim);
            font-family: 'Space Mono', monospace;
            letter-spacing: 1px;
        }

        /* ── founder social links: hidden, "spread" open on hover/focus/tap ── */
        .founder-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 0;
            margin-top: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, opacity 0.3s ease, margin-top 0.35s ease;
            align-items: center;
        }

        .founder-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            color: var(--muted);
            text-decoration: none;
            opacity: 0;
            transform: scale(0.7);
            transition: opacity 0.3s ease, transform 0.3s ease, color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
            pointer-events: none;
        }

        .founder-link:nth-child(1) { transition-delay: 0s; }
        .founder-link:nth-child(2) { transition-delay: 0.06s; }
        .founder-link:nth-child(3) { transition-delay: 0.12s; }

        .founder-link:hover,
        .founder-link:focus {
            color: #fff;
            border-color: rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.08);
        }

        .founder-link svg {
            width: 18px;
            height: 18px;
            display: block;
            fill: currentColor;
        }

        .servers-wrapper {
            width: 100%;
            max-width: 900px;
            margin-bottom: 60px;
        }

        .servers-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .servers-header::before,
        .servers-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .servers-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 6px;
            color: var(--muted);
            text-transform: uppercase;
            white-space: nowrap;
        }

        .carousel {
            position: relative;
            width: 100%;
            overflow: hidden;
            -webkit-mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent);
            mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent);
        }

        .carousel-track {
            display: flex;
            width: max-content;
            gap: 20px;
            animation: carousel-scroll 26s linear infinite;
        }

        .carousel:hover .carousel-track {
            animation-play-state: paused;
        }

        @keyframes carousel-scroll {
            from { transform: translateX(0); }
            to   { transform: translateX(-50%); }
        }

        .server-card {
            flex: 0 0 auto;
            display: block;
            width: 160px;
            height: 160px;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--surface);
            text-decoration: none;
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .server-card:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(255,255,255,0.25);
        }

        .server-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: 1px;
            color: #fff;
            background: linear-gradient(135deg, #2a2a2a, #111);
        }

        .server-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @media (max-width: 480px) {
            .server-card { width: 120px; height: 120px; }
            .carousel-track { gap: 14px; }
        }

        .section-wrapper {
            width: 100%;
            max-width: 700px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .section-header::before,
        .section-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .section-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 6px;
            color: var(--muted);
            text-transform: uppercase;
            white-space: nowrap;
        }

        .members-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px 20px;
            justify-items: center;
        }

        .member-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s ease;
            outline: none;
        }

        .member-card:hover,
        .member-card:focus {
            transform: scale(1.05);
        }

        .member-card:focus .member-avatar {
            box-shadow: 0 4px 24px rgba(0,0,0,0.7), 0 0 0 2px rgba(255,255,255,0.25);
        }

        .member-avatar-wrap {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .member-avatar {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 24px rgba(0,0,0,0.7);
            background: #111;
            z-index: 2;
        }

        .member-decoration {
            position: absolute;
            width: 100px;
            height: 100px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 4;
            object-fit: contain;
        }

        .member-status-dot {
            position: absolute;
            bottom: 3px;
            right: 3px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #747f8d;
            border: 2px solid var(--bg);
            z-index: 3;
            transition: background 0.3s ease;
        }

        .member-name {
            font-family: 'Space Mono', monospace;
            font-size: 0.55rem;
            letter-spacing: 2px;
            color: var(--muted);
            text-transform: lowercase;
            text-align: center;
            max-width: 90px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #audio-toggle {
            position: fixed;
            bottom: 22px;
            right: 22px;
            z-index: 50;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            color: var(--muted);
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
            outline: none;
        }

        #audio-toggle:hover,
        #audio-toggle:focus {
            background: rgba(255,255,255,0.08);
            color: var(--text);
            border-color: rgba(255,255,255,0.18);
            transform: scale(1.06);
        }

        #audio-toggle .audio-icon {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 1px;
            line-height: 1;
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {
            #audio-toggle { width: 38px; height: 38px; bottom: 16px; right: 16px; }
        }

        .skeleton-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(90deg, #111 25%, #1a1a1a 50%, #111 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s ease-in-out infinite;
        }

        .skeleton-text {
            height: 0.7rem;
            width: 60px;
            border-radius: 3px;
            background: linear-gradient(90deg, #111 25%, #1a1a1a 50%, #111 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s ease-in-out infinite;
        }

        .skeleton-text.short { width: 40px; }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .load-error {
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            color: var(--red);
            letter-spacing: 1px;
            text-align: center;
            padding: 20px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50%       { opacity: 1; text-shadow: 0 0 20px rgba(255,255,255,0.4); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .members-grid { grid-template-columns: repeat(3, 1fr); gap: 22px 14px; }
            .founder-avatar-wrap { width: 75px; height: 75px; }
            .founder-decoration { width: 78px; height: 78px; }
            .founder-status-dot { width: 12px; height: 12px; }
            .member-avatar-wrap { width: 68px; height: 68px; }
            .member-decoration { width: 72px; height: 72px; }
            .member-status-dot { width: 10px; height: 10px; }
            #founders-grid { gap: 28px; }
        }

        @media (max-width: 380px) {
            .members-grid { grid-template-columns: repeat(2, 1fr); }
            .founder-avatar-wrap { width: 65px; height: 65px; }
            .founder-decoration { width: 66px; height: 66px; }
            .member-avatar-wrap { width: 60px; height: 60px; }
            .member-decoration { width: 60px; height: 60px; }
        }
    </style>
</head>

<script>
(function () {
    "use strict";

    const FOUNDERS = [
        { id: '1521890728094208122', tag: 'daz' },
        { id: '1512675755459612835', tag: 'dx' },
    ];

    const STATUS_COLORS = {
        online:  '#43b581',
        idle:    '#faa61a',
        dnd:     '#f04747',
        offline: '#747f8d',
    };

    const RETRY_DELAYS = [1000, 2000, 4000];

    // Initialize splash screen
    function initIntro() {
        const intro = document.getElementById('intro');
        const mainContent = document.getElementById('main-content');
        if (!intro || !mainContent) return;

        function showMain() {
            intro.classList.add('hidden');
            mainContent.classList.add('visible');
            document.getElementById('audio-toggle').style.display = 'flex';
            playAudio();
        }

        intro.addEventListener('click', showMain);
        intro.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                showMain();
            }
        });
    }

    (function initStars() {
        const canvas = document.getElementById('stars');
        if (!canvas) return;
        const ctx    = canvas.getContext('2d');
        let stars    = [];
        let w, h;

        function resize() {
            w = canvas.width  = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        function genStars(n) {
            stars = [];
            for (let i = 0; i < n; i++) {
                stars.push({
                    x:  Math.random() * w,
                    y:  Math.random() * h,
                    r:  Math.random() * 1.1 + 0.2,
                    o:  Math.random() * 0.5 + 0.1,
                    s:  (Math.random() - 0.5) * 0.003,
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, w, h);
            stars.forEach(s => {
                s.o += s.s;
                if (s.o <= 0.05 || s.o >= 0.65) s.s *= -1;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${s.o})`;
                ctx.fill();
            });
            requestAnimationFrame(draw);
        }

        resize();
        genStars(180);
        draw();

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => { resize(); }, 150);
        });
    })();

    function avatarUrl(user, size) {
        size = size || 128;
        if (!user || !user.avatar) {
            return defaultAvatarUrl(user);
        }
        const ext = user.avatar.startsWith('a_') ? 'gif' : 'png';
        return 'https://cdn.discordapp.com/avatars/' + user.id + '/' + user.avatar + '.' + ext + '?size=' + size;
    }

    function defaultAvatarUrl(user) {
        if (!user) return 'https://cdn.discordapp.com/embed/avatars/0.png';
        if (!user.discriminator || user.discriminator === '0') {
            var idx = 0;
            try { idx = Number((BigInt(user.id) >> BigInt(22)) % BigInt(6)); } catch (e) { idx = 0; }
            return 'https://cdn.discordapp.com/embed/avatars/' + idx + '.png';
        }
        return 'https://cdn.discordapp.com/embed/avatars/' + (user.discriminator % 5) + '.png';
    }

    function setAvatarWithFallback(imgEl, user, size) {
        if (!imgEl || !user) return;
        size = size || 128;
        var isAnimated = !!(user.avatar && user.avatar.startsWith('a_'));
        var triedWebp = false;
        imgEl.src = avatarUrl(user, size);
        imgEl.onerror = function() {
            if (isAnimated && !triedWebp) {
                triedWebp = true;
                imgEl.src = 'https://cdn.discordapp.com/avatars/' + user.id + '/' + user.avatar + '.webp?size=' + size + '&animated=true';
                return;
            }
            imgEl.onerror = null;
            imgEl.src = defaultAvatarUrl(user);
        };
    }

    function applyStatus(dotEl, status) {
        if (!dotEl) return;
        dotEl.style.background = STATUS_COLORS[status] || STATUS_COLORS.offline;
        dotEl.setAttribute('data-status', status || 'offline');
    }

    async function fetchUser(id, attempt) {
        attempt = attempt || 0;
        try {
            var res  = await fetch('https://api.lanyard.rest/v1/users/' + id);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            var json = await res.json();
            if (!json.success) throw new Error('API error');
            return json.data;
        } catch (err) {
            if (attempt < RETRY_DELAYS.length) {
                await new Promise(function(r) { setTimeout(r, RETRY_DELAYS[attempt]); });
                return fetchUser(id, attempt + 1);
            }
            console.warn('Failed to fetch user ' + id + ':', err.message);
            return null;
        }
    }

    async function updateFounder(id) {
        var data = await fetchUser(id);
        var card = document.getElementById('founder-' + id);
        if (!card) return;

        var nameEl = card.querySelector('.founder-name');

        if (!data || !data.discord_user) {
            if (nameEl) nameEl.textContent = 'unavailable';
            return;
        }

        var discord_user = data.discord_user;
        var discord_status = data.discord_status;

        var founderAvatar = card.querySelector('.founder-avatar');
        setAvatarWithFallback(founderAvatar, discord_user, 128);

        if (nameEl) nameEl.textContent = discord_user.global_name || discord_user.username;
        applyStatus(card.querySelector('.founder-status-dot'), discord_status);

        var decEl = card.querySelector('.founder-decoration');
        if (decEl && discord_user.avatar_decoration_data && discord_user.avatar_decoration_data.asset) {
            decEl.src = 'https://cdn.discordapp.com/avatar-decoration-presets/' + discord_user.avatar_decoration_data.asset + '.png?size=128&passthrough=true';
            decEl.classList.remove('hidden');
            decEl.onerror = function() { decEl.classList.add('hidden'); };
        } else if (decEl) {
            decEl.classList.add('hidden');
        }
    }

    function initFounderToggle() {
        const toggle = document.getElementById('founders-toggle');
        const grid = document.getElementById('founders-grid');
        const arrow = document.getElementById('founders-arrow');
        if (!toggle || !grid || !arrow) return;

        toggle.addEventListener('click', function() {
            grid.classList.toggle('collapsed');
            arrow.classList.toggle('open');
            const isExpanded = !grid.classList.contains('collapsed');
            toggle.setAttribute('aria-expanded', isExpanded);
        });

        toggle.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggle.click();
            }
        });
    }

    function initFounderSpread() {
        const cards = document.querySelectorAll('.founder-card');
        cards.forEach(card => {
            card.addEventListener('click', function(e) {
                if (e.target.closest('.founder-link')) return;
                card.classList.toggle('spread');
            });

            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    card.classList.toggle('spread');
                }
            });

            document.addEventListener('click', (e) => {
                if (!card.contains(e.target)) {
                    card.classList.remove('spread');
                }
            });
        });
    }

    function initAudio() {
        const audio = document.getElementById('bg-audio');
        const toggle = document.getElementById('audio-toggle');
        if (!audio || !toggle) return;

        toggle.addEventListener('click', function() {
            if (audio.paused) {
                audio.play();
                toggle.innerHTML = '<span class="audio-icon">❙❙</span>';
            } else {
                audio.pause();
                toggle.innerHTML = '<span class="audio-icon">▶</span>';
            }
        });
    }

    function playAudio() {
        const audio = document.getElementById('bg-audio');
        if (audio) {
            audio.play().catch(() => {});
        }
    }

    // Initialize everything
    function init() {
        initIntro();
        initFounderToggle();
        initFounderSpread();
        initAudio();
        FOUNDERS.forEach(f => updateFounder(f.id));
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
